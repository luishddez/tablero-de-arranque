<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4e0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tablero">
<title>Tablero de arranque</title>
<style>
/* Colores con significado fijo, siempre con una palabra o un ícono además del color:
   verde = lo que toca ahora · azul = agendado en Calendar · gris = opcional o libre · ámbar = facilitador.
   Texto con contraste mayor a 4.5:1. */
:root{--bg:#fbf7ef;--bg2:#ffe9c2;--card:#ffffff;--ink:#1d1a14;--mute:#5d574b;--line:#e7dfcf;--sh:0 1px 2px rgba(60,40,10,.07);
 --now:#17603f;--now-t:#0d5a38;--now-g1:#dff4e8;--now-g2:#bfe6d1;
 --cal:#1d4a9c;--cal-t:#153a85;--cal-g1:#e4ecfc;--cal-g2:#c9d9f6;
 --opt:#5d574b;--opt-g1:#f3efe6;--opt-g2:#e9e3d5;
 --fac-bg:#fff0bf;--fac-t:#5a4200;--fri-bg:#fde0cd;--fri-t:#7a3000;
 --warn:#8a4b00;--warn-bg:#fdf1e0;--star:#b36b00;
 --k-cal:#1d4a9c;--k-ess:#b8860b;--k-tar:#17603f;--k-comida:#d9480f;--k-gym:#be185d;--k-rut:#6d28d9;--k-otro:#78716c}
:root[data-tema="oscuro"]{--bg:#121413;--bg2:#1c2a22;--card:#1c1f1d;--ink:#f3f1ea;--mute:#b9b6ab;--line:#363b37;--sh:0 1px 2px rgba(0,0,0,.4);
 --now:#7fd6a8;--now-t:#9be3bd;--now-g1:#1e3b2c;--now-g2:#17301f;
 --cal:#9db8f2;--cal-t:#b8ccf7;--cal-g1:#1c2a47;--cal-g2:#18233a;
 --opt:#b9b6ab;--opt-g1:#262a27;--opt-g2:#202422;
 --fac-bg:#3b3210;--fac-t:#ffe08a;--fri-bg:#40251a;--fri-t:#ffc7a8;
 --warn:#f0b36a;--warn-bg:#2c2214;--star:#ffcb6b;
 --k-cal:#7aa2f7;--k-ess:#f5c542;--k-tar:#5fd39a;--k-comida:#ff8a50;--k-gym:#f472b6;--k-rut:#a78bfa;--k-otro:#a8a29e}
/* Un color por tipo de actividad: azul Calendar · dorado esencial · verde tarea · naranja comida · rosa gym · morado rutina (mañana y cierre) · gris lo demás */
.k-cal{--k:var(--k-cal)} .k-ess{--k:var(--k-ess)} .k-tar{--k:var(--k-tar)} .k-comida{--k:var(--k-comida)} .k-gym{--k:var(--k-gym)} .k-rut{--k:var(--k-rut)} .k-otro{--k:var(--k-otro)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:680px;margin-inline:auto;
 /* La página no se desplaza: se desplaza solo #vista por dentro. Así la barra del navegador del celular se queda quieta. */
 position:fixed;top:0;bottom:0;left:0;right:0;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
html{height:100%;overflow:hidden;overscroll-behavior:none}
#vista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 96px}
button{font:inherit;color:inherit;border:0;background:var(--card);border-radius:14px;padding:11px 16px;cursor:pointer;box-shadow:var(--sh)}
button:active{transform:scale(.97)}
button.pri{background:var(--now);color:#fff;font-weight:700}
:root[data-tema="oscuro"] button.pri{color:#0c1a12}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 2px}
.saludo{font-size:18px;font-weight:800;letter-spacing:-.01em}
.fechaTxt{color:var(--mute);font-size:12.5px;margin-top:1px}
/* Sol interactivo: sale, cruza el cielo y se pone según la hora; de noche sale la luna */
.hdr{display:flex;gap:10px;align-items:center}
.sol{width:54px;height:54px;padding:0;border-radius:50%;overflow:hidden;flex:none;box-shadow:var(--sh);background:none}
.sol svg{width:100%;height:100%;display:block}
.sol.pulso{animation:pulso .8s ease}
@keyframes pulso{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-8deg)}60%{transform:scale(.95) rotate(6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sol.pulso{animation:none}}
/* Frase mínima: una línea, apagada; al tocarla se abre completa con su autor */
.frase{margin:0 0 10px;padding:0;cursor:pointer}
.frase q{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font:italic 13.5px/1.35 Georgia,"Times New Roman",serif;quotes:none;color:var(--mute)}
.frase.open q{display:block}
.frase small{display:none;color:var(--mute);font-size:11.5px;margin-top:3px}
.frase.open small{display:block}
.esencial-l{font-size:13px;color:var(--mute);margin:0 0 8px}
.mini{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:12px 2px 4px}
.dc-r{font-size:12px;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dc-r .falta{color:var(--k-comida);font-weight:700}
.hero{border-radius:18px;padding:14px 16px;margin-bottom:8px;background:var(--now-g1);position:relative}
.hero.cal{background:var(--cal-g1)}
.hero.opt,.hero.libre{background:var(--opt-g1)}
.hero .cab{display:flex;gap:12px;align-items:center}
.ico{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:2.5px solid var(--k,transparent)}
.etq{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--now-t)}
.hero.cal .etq{color:var(--cal-t)} .hero.opt .etq,.hero.libre .etq{color:var(--opt)}
.hero h2{font-size:19px;line-height:1.2;margin:2px 0 0;letter-spacing:-.01em}
.hero .hora{color:var(--mute);font-size:13px;margin-top:8px}
.hero .acc{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.hero .acc .pri{font-size:17px;padding:11px 22px;border-radius:14px}
.bar{height:6px;background:rgba(0,0,0,.09);border-radius:10px;overflow:hidden;margin-top:10px}
:root[data-tema="oscuro"] .bar{background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--now),#3fae7a);width:0;border-radius:10px;transition:width .5s}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chip{display:flex;gap:7px;align-items:flex-start;border-radius:10px;padding:5px 10px;font-size:13px;line-height:1.3}
.chip.f{background:var(--fac-bg);color:var(--fac-t)} .chip.r{background:var(--fri-bg);color:var(--fri-t)}
.chip b{white-space:nowrap}
.estado{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;text-align:center}
.ring .c b{font-size:16px} .ring .c small{font-size:11px;color:var(--mute)}
.pills{display:flex;flex-direction:column;gap:5px;flex:1;font-size:13.5px}
.pill{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:5px 10px}
.pill span{color:var(--mute)}
.aviso{background:var(--warn-bg);border-left:5px solid var(--warn);color:var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.libre-ok{background:var(--now-g1);border-radius:14px;padding:9px 12px;margin-bottom:10px;font-size:14px}
h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:20px 2px 8px}
.it{display:flex;gap:11px;align-items:center;background:transparent;border-radius:0;padding:9px 4px 9px 12px;margin-bottom:0;border-bottom:1px solid var(--line)}
.it .e{font-size:22px;width:30px;text-align:center;flex:none}
.it .h{display:block;color:var(--mute);font-size:11.5px}
.it .t{flex:1;min-width:0;font-size:15px}
.it{box-shadow:inset 3px 0 0 var(--k,var(--k-otro))}
.it.opc{opacity:.6}   /* opcional: se atenúa en lugar de ponerle una etiqueta */
.it .chips{margin-top:6px}
details{margin-top:6px} summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 2px}
.hecho{text-decoration:line-through;color:var(--mute)}
.nota{font-size:14px;color:var(--mute)}
/* La barra queda sobre la etiqueta "Powered by Netlify" (esquina inferior derecha), para que no tape Anotar ni el dictado */
/* Anotar: un botón redondo abajo a la IZQUIERDA (la etiqueta de Netlify queda a la derecha y no estorba).
   🎤 dicta a texto · ➤ guarda cuando ya hay texto. La caja de texto aparece arriba solo cuando hace falta. No ocupa espacio de la pantalla. */
#cap{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin-inline:auto;padding:0 16px calc(14px + env(safe-area-inset-bottom));z-index:4;pointer-events:none}
#cap>*{pointer-events:auto}
.fabrow{display:flex;align-items:center;gap:10px}
.cap-b{flex:none;width:50px;height:50px;border-radius:50%;padding:0;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--now);color:var(--card);box-shadow:0 2px 8px rgba(23,96,63,.25)}
.cap-b.rec{background:#c62828;color:#fff;animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.1)}}
.cap-t{background:transparent;border-radius:999px;box-shadow:none;border:1px solid var(--line);padding:9px 14px;font-size:14px;color:var(--mute);max-width:calc(100vw - 32px - 66px - 190px)}
@media (min-width:561px){.cap-t{max-width:none}}
#cap.on .cap-t{display:none}
.comp{display:none;background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:8px 8px 8px 14px;margin-bottom:10px}
#cap.on .comp{display:block}
.comp-r{display:flex;align-items:center;gap:6px}
.comp input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);padding:8px 0;outline:none}
.cap-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:14px;box-shadow:none;background:var(--bg);color:var(--mute)}
.comp-h{font-size:12.5px;color:var(--mute);padding:2px 4px 2px 0}
.comp-h:empty{display:none}
.cap-re{font-size:12.5px;padding:6px 12px;margin:4px 0 2px;box-shadow:none;background:var(--bg);border-radius:10px;font-weight:700}
/* Hoy · Mañana · Semana: tres opciones en orden de tiempo */
.seg{flex:none;display:flex;gap:20px;margin:4px 16px 8px;padding:0}
.seg button{flex:none;box-shadow:none;background:transparent;border-radius:0;padding:4px 0;font-size:14px;color:var(--mute);border-bottom:2px solid transparent}
.seg button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--now)}
.dia-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 2px 8px;font-size:17px}
.dia-card.sola{cursor:default}
.atras{margin:0 0 8px;padding:6px 12px;font-size:13.5px;border-radius:12px}
.sem-d{display:block;width:100%;text-align:left;padding:9px 12px 8px;margin-bottom:8px;border-radius:14px;background:transparent;box-shadow:none;border:1px solid var(--line)}
.sem-d.hoy{box-shadow:inset 0 0 0 2px var(--now),var(--sh)}
.sem-d .dc-strip{margin-top:6px;height:18px}
.sem-n{font-size:15px} .sem-m{font-size:12.5px;color:var(--mute);margin-top:5px;min-height:16px}
.sg-e{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:13px;line-height:1;z-index:2;pointer-events:none}
#menu{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:0 16px 40px;z-index:5}
#menu .in{max-width:680px;margin:0 auto}
#menu .top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
#menu h1{font-size:22px;margin:0}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.card .it2{padding:6px 0;border-top:1px solid var(--line);font-size:15px} .card .it2:first-of-type{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=time]{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
.hide{display:none!important}
.dia-card{display:block;width:100%;text-align:left;padding:2px 0 4px;margin:2px 0 10px;border-radius:0;background:transparent;box-shadow:none}
.dia-card .dc-strip{margin-top:0;height:16px}
.dc-go{color:var(--now-t);font-weight:700;font-size:12.5px;white-space:nowrap}
/* Alerta de comida: aparece arriba en TODAS las pantallas y sube de intensidad (13:00 aviso · 14:00 urgente · 15:00 rojo y pulsando) hasta que se toca "Ya comí" */
#alerta{flex:none;margin:0 16px 8px;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
#alerta .at{flex:1;font-weight:800;line-height:1.25;font-size:15.5px}
#alerta .as{display:block;font-weight:500;font-size:13px;margin-top:2px}
#alerta button{flex:none;padding:11px 14px;font-weight:800;font-size:15px;border-radius:12px}
#alerta.n1{background:var(--warn-bg);border-left:6px solid var(--warn);color:var(--ink)}
#alerta.n2{background:#ffd9a8;border-left:6px solid #d9480f;color:#3a1d00}
#alerta.n2 button{background:#d9480f;color:#fff}
#alerta.n3{background:#c62828;color:#fff;animation:alerta 1.4s ease-in-out infinite}
#alerta.n3 button{background:#fff;color:#b71c1c}
@keyframes alerta{50%{box-shadow:0 0 0 5px rgba(198,40,40,.35)}}
:root[data-tema="oscuro"] #alerta.n2{background:#5a3412;color:#ffe2bd}
@media (prefers-reduced-motion:reduce){#alerta.n3{animation:none}}
.ghost{width:100%;margin-top:8px;background:transparent;border:1px solid var(--line);box-shadow:none;padding:8px;font-size:14px;color:var(--mute)}
.fi{font-size:12px;opacity:.8}
.dc-strip{position:relative;height:24px;border-radius:12px;background:var(--bg);margin-top:12px;overflow:hidden;border:1px solid var(--line)}
.sg{position:absolute;top:3px;bottom:3px;border-radius:6px}
.sg{background:var(--k,var(--k-otro))}
.dc-now{position:absolute;top:0;bottom:0;width:3px;background:#d1542b;border-radius:2px}
.dc-h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:5px}
/* Planear el día */
#plan{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:0 16px 220px;z-index:6}
#plan .in{max-width:680px;margin:0 auto}
#plan .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap;padding:10px 0 8px;position:sticky;top:0;background:var(--bg);z-index:9}
.blk.emp{outline:2px dashed var(--warn);outline-offset:-2px}
.blk .bt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blk.peq{padding-top:3px;padding-bottom:3px;line-height:1.2}
.blk.peq .bt{-webkit-line-clamp:1}
#plan h1{font-size:20px;margin:0}
/* Encabezado del planificador: una sola fila, todo de 40 px de alto. Izquierda: ‹ día › en una píldora. Derecha: ＋ Agregar y ✕ */
.pnav{display:flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:var(--sh);padding:2px;flex:none}
.pnav button{width:36px;height:36px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:transparent;box-shadow:none}
#plan .pnav h1{font-size:16px;min-width:62px;text-align:center;white-space:nowrap}
.pacc{display:flex;align-items:center;gap:8px;flex:none}
.padd{height:40px;padding:0 14px;border-radius:999px;background:var(--now);color:var(--card);font-weight:700;font-size:15px;white-space:nowrap;box-shadow:none}
.pcls{width:40px;height:40px;padding:0;border-radius:50%;font-size:16px;line-height:1;background:var(--card);box-shadow:var(--sh)}
.selbar .row button{padding:9px 12px;font-size:14px}
@media (max-width:350px){.pnav button{width:32px}#plan .pnav h1{min-width:52px;font-size:15px}.padd{padding:0 10px;font-size:14px}}
.agr-t{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:9px;background:var(--card);color:var(--ink)}
#agrD{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
.tl{position:relative;margin-top:8px;border-radius:16px;background:var(--card);box-shadow:var(--sh);user-select:none;-webkit-user-select:none}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hl span{position:absolute;left:8px;top:2px;font-size:12px;color:var(--mute)}
.nowl{position:absolute;left:44px;right:0;border-top:3px solid #d1542b;z-index:2;pointer-events:none}
.blk{position:absolute;border-radius:12px;padding:6px 34px 6px 9px;overflow:hidden;font-size:14px;line-height:1.25;box-shadow:var(--sh);cursor:pointer;z-index:1;border-left:7px solid var(--k,var(--k-otro));background:var(--card);background:color-mix(in srgb,var(--k,var(--k-otro)) 16%,var(--card))}
.blk .bt{font-weight:700} .blk .bh{font-size:12.5px;color:var(--mute)}
.blk.sel{outline:3px solid var(--ink);z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.blk.hecho{opacity:.55} .blk.drag{z-index:5;opacity:.9}
.grip{position:absolute;right:2px;top:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;font-size:20px;color:var(--mute)}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 22px rgba(0,0,0,.18);padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:8}
.selbar .in{max-width:680px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;width:10px;height:14px;top:40%;left:50%;z-index:10;pointer-events:none;border-radius:3px;animation:cae 1.3s ease-out forwards}
@keyframes cae{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.bar i{transition:none}button:active{transform:none}}
</style>
</head>
<body>
<header><div class="hdr"><button id="sol" class="sol" data-a="sol" aria-label="Sol del día: toca para ver a qué hora sale y se pone"></button><div><div class="saludo" id="saludo">Hola</div><div class="fechaTxt" id="fecha"></div></div></div><button id="btnMenu" aria-label="Abrir menú">☰ Menú</button></header>
<nav class="seg" id="seg" aria-label="Ver día"><button data-a="vista" data-v="hoy" class="on">Hoy</button><button data-a="vista" data-v="man">Mañana</button><button data-a="vista" data-v="sem">Semana</button></nav>
<div id="alerta" class="hide" role="alert" aria-live="assertive"></div>
<main id="vista"></main>
<div id="cap">
  <div class="comp" id="comp"><div class="comp-r"><input type="text" id="capIn" placeholder="Escribe tu nota…" enterkeyhint="send" autocomplete="off"><button id="capX" class="cap-x" aria-label="Borrar la nota">✕</button></div><div class="comp-h" id="compH"></div><button id="capRe" class="cap-re hide" type="button">Reintentar el dictado</button></div>
  <div class="fabrow"><button id="capBtn" class="cap-b" aria-label="Dictar una nota">🎤</button><button id="capTxt" class="cap-t">✏️ Anota…</button></div>
</div>
<div id="menu" class="hide"><div class="in" id="menuIn"></div></div>
<div id="plan" class="hide"><div class="in" id="planIn"></div></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
