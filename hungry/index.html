<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hungry</title>
<meta name="theme-color" content="#2f5d3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hungry">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c1c1a;--mut:#6b6b64;--br:#e3e0d6;--ac:#2f5d3a;--ac2:#e9f1e6;--warn:#b45309;--warn2:#fdf0dc;--bad:#b3261e;--bad2:#fbe5e3;--ok:#1d7a3a}
@media(prefers-color-scheme:dark){:root{--bg:#141613;--card:#1e211c;--tx:#ecebe4;--mut:#9c9c92;--br:#2e322a;--ac:#7fc08d;--ac2:#22301f;--warn:#f0b35a;--warn2:#33291a;--bad:#f2928b;--bad2:#3a1f1d;--ok:#7fd38f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 6px}
.mut{color:var(--mut);font-size:13px}.nota{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}@media(prefers-color-scheme:dark){button.pri{color:#10200f}}
button.sm{padding:5px 9px;font-size:14px}button.ghost{background:transparent}button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--br);border-radius:10px;padding:9px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--br);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px 8px;font-size:11px;color:var(--mut)}
.tabs button b{display:block;font-size:20px;line-height:1.1}.tabs button.on{color:var(--ac);font-weight:700}
.bar{height:10px;background:var(--br);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bar.over i{background:var(--warn)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px;margin:2px 3px 2px 0}
.chip.w{background:var(--warn2);color:var(--warn)}.chip.b{background:var(--bad2);color:var(--bad)}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--br)}.it:first-child{border-top:0}
.em{font-size:26px;width:34px;text-align:center}
.q{display:flex;align-items:center;gap:6px}.q button{width:34px;padding:6px 0}.q span{min-width:54px;text-align:center;font-weight:600}
.estado{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--ac2);color:var(--ac)}.estado.w{background:var(--warn2);color:var(--warn)}.estado.b{background:var(--bad2);color:var(--bad)}
.macros{display:flex;gap:10px;font-size:13px;color:var(--mut)}.macros b{color:var(--tx)}
.tinder{position:relative;height:340px;touch-action:pan-y;user-select:none}
.tcard{position:absolute;inset:0;background:var(--card);border:1px solid var(--br);border-radius:22px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.12);touch-action:none}
.tcard .big{font-size:96px;line-height:1.1}.tcard h3{font-size:22px;margin:8px 0 2px}
.tcard .sello{position:absolute;top:18px;padding:3px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:22px;opacity:0;transform:rotate(-12deg)}
.sello.si{left:18px;color:var(--ok)}.sello.no{right:18px;color:var(--bad);transform:rotate(12deg)}
.tbtn{display:flex;justify-content:center;gap:28px;margin-top:12px}.tbtn button{width:72px;height:72px;border-radius:50%;font-size:30px;padding:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 28px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 15px;border-radius:99px;font-size:14px;z-index:60;max-width:90%}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.seg button.on{color:#10200f}}
.hide{display:none!important}
/* --- UX/UI v2: jerarquía, ritmo y zonas táctiles --- */
:root{--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--sh:0 1px 2px rgba(0,0,0,.4)}}
h1{font-size:26px;letter-spacing:-.3px;margin:2px 0 0}
h2{font-size:18px;margin:22px 0 8px;letter-spacing:-.2px}
.card{box-shadow:var(--sh);border-radius:16px;padding:14px}
button,.btn,select,input{min-height:44px}
button.sm{min-height:38px}
button:active{transform:scale(.97)}
button,.btn{transition:transform .1s,background .15s}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input[type=checkbox],input[type=radio]{min-height:0;width:22px;height:22px;accent-color:var(--ac)}
.estado{font-size:11px;padding:3px 8px;white-space:nowrap}
.tabs{box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tabs button{position:relative;min-height:56px;font-size:11px;font-weight:500}
.tabs button b{font-size:22px;transition:transform .15s}
.tabs button.on b{transform:translateY(-2px) scale(1.1)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}
/* Hoy: anillo + macros */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--ac2),var(--card));border:1px solid var(--br);border-radius:20px;padding:16px;margin:12px 0 8px;box-shadow:var(--sh)}
.ring{--p:0;flex:none;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--br) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.ring.over{background:conic-gradient(var(--warn) calc(var(--p)*1%),var(--br) 0)}
.ring>div{position:relative;text-align:center;line-height:1.1}.ring b{display:block;font-size:26px;letter-spacing:-.5px}.ring span{font-size:11px;color:var(--mut)}
.hs{flex:1;min-width:0}.hl{font-size:15px;margin-bottom:8px}.hl b{font-size:17px}
.mb{margin:6px 0;font-size:12px}.mb .bar{height:6px;margin-top:3px}.bar.sec i{background:var(--mut);opacity:.7}
.sw{display:flex;align-items:center;gap:10px;margin:6px 2px 10px;color:var(--tx);font-size:15px}
.sw input{position:absolute;opacity:0;width:44px;height:26px;min-height:0}.sw .knob{flex:none;position:relative;width:44px;height:26px;border-radius:99px;background:var(--br);transition:.2s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+.knob{background:var(--ac)}.sw input:checked+.knob::after{left:21px}
.sw input:focus-visible+.knob{outline:3px solid var(--ac);outline-offset:2px}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn2);color:var(--tx);border-radius:14px;padding:12px;margin:8px 0;font-size:14px}
.aviso.ok{background:var(--ac2)}.aviso .ai{font-size:20px;line-height:1.2}
.next{background:var(--card);border:2px solid var(--ac);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.next h2{margin:6px 0 4px;font-size:22px}.next p{margin:0 0 12px;color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--ac);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
@media(prefers-color-scheme:dark){.tag{color:#10200f}}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2 .pri{flex:1 1 100%;min-height:50px;font-size:17px;font-weight:600}.acts2 button:not(.pri){flex:1}
.lista{padding:2px 14px}
.dl summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none;min-height:48px}
.dl summary::-webkit-details-marker{display:none}.dl+.dl{border-top:1px solid var(--br)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--br);display:grid;place-items:center;font-size:14px;color:#fff}
.dl.hecho .dot{background:var(--ok);border-color:var(--ok)}.dl.hecho b{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--br)}
.dd{padding:0 0 12px 34px}
.vacio{text-align:center;padding:28px 16px;background:var(--card);border:1px dashed var(--br);border-radius:20px;margin:14px 0}
.vacio .big{font-size:56px}.vacio p{color:var(--mut);margin:4px 0 14px}
.sug{border-left:4px solid var(--ac)}
/* Registro: acciones grandes */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border-radius:16px;font-weight:600;box-shadow:var(--sh)}
.acts button b{font-size:28px;line-height:1}.acts button:first-child{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.acts button:first-child{color:#10200f}}
/* Dieta: pasos */
.paso{display:flex;align-items:center;gap:14px;cursor:pointer}
.pn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ac2);color:var(--ac);font-weight:800;display:grid;place-items:center}
.paso.ok .pn{background:var(--ok);color:#fff}
@media(prefers-color-scheme:dark){.paso.ok .pn{color:#10200f}}
/* listas */
.it[data-a]{cursor:pointer}.it{min-height:52px}
.seg button{min-height:42px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.opt{display:inline-flex;margin:0;color:var(--tx);font-size:15px}.opt input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}.opt span{display:inline-block;padding:9px 14px;border:1px solid var(--br);border-radius:99px;background:var(--card);min-height:40px;line-height:22px;cursor:pointer}.opt input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.opt input:focus-visible+span{outline:3px solid var(--ac);outline-offset:2px}
.preg{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--sh)}.preg.ok{border-left:4px solid var(--ok)}.preg>label{color:var(--tx);font-size:15px;font-weight:600;margin:0 0 4px}.abierta{margin-top:8px}.abierta summary{color:var(--ac);font-size:14px;cursor:pointer;padding:6px 0;min-height:36px}.abierta textarea,.preg>textarea{margin-top:4px}
@media(prefers-color-scheme:dark){.opt input:checked+span{color:#10200f}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:360px){.hero{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="alimentos.js"></script>
<script src="platillos.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="dieta.js"></script>
<script src="entrevista.js"></script>
<script>HG.iniciar();</script>
</body>
</html>
